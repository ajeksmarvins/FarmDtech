name: FarmDtech published price tests

on:
  pull_request:
    paths:
      - 'src/live_prices.py'
      - 'tests/test_live_prices.py'
      - 'api.py'
      - 'requirements.txt'
      - '.github/workflows/live-price-tests.yml'
  workflow_dispatch:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal parser dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test published price parsing
        run: python -m unittest discover -s tests -p 'test_live_prices.py' -v
      - name: Validate Python syntax
        run: python -m py_compile src/live_prices.py api.py
